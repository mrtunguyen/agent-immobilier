name: rental-scout

on:
  schedule:
    # Every 8 hours at :17 past — 00:17, 08:17 and 16:17 UTC, so 02:17, 10:17 and
    # 18:17 in France in summer. Off the hour on purpose: scheduled runs queue
    # behind everyone else's at :00.
    #
    # Three runs a day caps how long a listing waits at 8 hours, and costs ~270
    # metered Actions minutes a month against the free 2,000. Gemini spend is
    # unaffected either way — it scales with new listings, not with runs.
    - cron: "17 */8 * * *"
  workflow_dispatch: {}

# The run commits data/ back to the repo, so two runs must never overlap.
concurrency:
  group: rental-scout
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the pipeline
        env:
          PYTHONPATH: src
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python -m scout

      - name: Commit state and dashboard
        run: |
          git config user.name "rental-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/index.html
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "chore: scout run $(date -u +%FT%TZ)"
          # Another run may have pushed while this one was analysing.
          git pull --rebase --autostash
          git push
